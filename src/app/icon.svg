<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="og-orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="og-core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="og-node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="32" height="32" rx="8" fill="#030718" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />

  <!-- Core Ambient Glow -->
  <circle cx="16" cy="16" r="8" fill="#00e5ff" opacity="0.18" />

  <!-- Central Cyber Globe Core -->
  <circle cx="16" cy="16" r="6.5" fill="url(#og-core-grad)" stroke="#7dd3fc" stroke-width="0.8" />
  <ellipse cx="16" cy="16" rx="6.5" ry="2.8" fill="none" stroke="#bae6fd" stroke-width="0.65" stroke-opacity="0.85" />
  <line x1="16" y1="9.5" x2="16" y2="22.5" stroke="#bae6fd" stroke-width="0.6" stroke-opacity="0.7" stroke-dasharray="1 1" />

  <!-- Orbital Ring Trajectory (-30 deg) -->
  <ellipse cx="16" cy="16" rx="12" ry="4.5" transform="rotate(-30 16 16)" fill="none" stroke="url(#og-orbit-grad)" stroke-width="1.5" stroke-dasharray="60 10" />

  <!-- Glowing Satellite Byte Node -->
  <circle cx="6.8" cy="10.5" r="1.8" fill="url(#og-node-glow)" stroke="#ffffff" stroke-width="0.7" />
  <circle cx="6.8" cy="10.5" r="3.2" fill="#00e5ff" opacity="0.3" />

  <!-- Counter Node -->
  <circle cx="25" cy="21.2" r="1.2" fill="#38bdf8" />
</svg>
