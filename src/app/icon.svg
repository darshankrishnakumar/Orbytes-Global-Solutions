<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="og-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="inner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="32" height="32" rx="8" fill="#030714" />
  <!-- Vibrant Gradient Outer Ring -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="url(#og-grad)" />
  <!-- Inner Dark Mask -->
  <rect x="4" y="4" width="24" height="24" rx="5" fill="#050814" />
  <!-- Central Stylized 'O' -->
  <circle cx="16" cy="16" r="7" fill="none" stroke="url(#og-grad)" stroke-width="3" />
  <!-- High-tech cyan core pulse -->
  <circle cx="16" cy="16" r="2.5" fill="#22d3ee" />
</svg>
