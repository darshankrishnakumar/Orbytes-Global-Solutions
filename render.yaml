services:
  - type: web
    name: orbytes-global-solutions
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://orbytesglobal.com
      - key: PORT
        value: 10000
